<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>编辑器 · 小剧场走词台</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="conn-status" class="conn"></div>
  <div class="topbar">
    <h1>📝 编辑器</h1>
    <nav>
      <a href="/">首页</a>
      <a href="/editor.html" class="active">编辑器</a>
      <a href="/operator.html">操作员台</a>
      <a href="/audience.html">观众屏</a>
    </nav>
  </div>

  <div class="layout">
    <div>
      <div class="panel">
        <h2>字幕草稿</h2>
        <div class="row" style="margin-bottom:10px;">
          <label style="margin:0;">剧本</label>
          <select id="script-select" style="max-width:260px;"></select>
          <button id="new-script" class="small">新建剧本</button>
        </div>
        <p class="muted" style="margin:0 0 10px;">
          序号为正整数且同一版本内不可重复；字幕文本不可为空白。草稿可随时自动保存，发布后内容固化、不再被草稿修改影响。
        </p>
        <div id="entries"></div>
        <div class="row" style="margin-top:6px;">
          <button id="add-entry" class="small">＋ 添加一条</button>
          <button id="renumber" class="small">整理为连续序号</button>
          <button id="load-demo" class="small">填入示例</button>
          <div class="spacer"></div>
          <span id="draft-status" class="muted"></span>
        </div>
      </div>

      <div class="panel">
        <h2>发布演出版本</h2>
        <label>版本备注（可选，如“首演场 / 带谢幕词”）</label>
        <input type="text" id="publish-label" placeholder="例如：首演正式版" />
        <div class="row" style="margin-top:10px;">
          <button id="publish" class="primary">发布新版本</button>
          <span class="muted">发布不可修改；演出中的场次永远保持发布时的内容。</span>
        </div>
      </div>
    </div>

    <div>
      <div class="panel">
        <h2>已发布版本</h2>
        <div id="version-list" class="pill-list"><span class="muted">尚无版本</span></div>
      </div>

      <div class="panel">
        <h2>演出场次</h2>
        <label>场次名称</label>
        <input type="text" id="session-name" placeholder="例如：9月30日 晚场" />
        <label style="margin-top:10px;">使用版本</label>
        <select id="session-version"></select>
        <div class="row" style="margin-top:10px;">
          <button id="create-session" class="primary">创建场次</button>
        </div>
        <h3>已有场次</h3>
        <div id="session-list" class="pill-list"><span class="muted">尚无场次</span></div>
      </div>
    </div>
  </div>

  <div id="toasts"></div>
  <script src="/app.js"></script>
  <script>
  (() => {
    const { $, h, RpcSocket, mountStatus, toast } = window.TP;
    const socket = new RpcSocket();
    mountStatus(socket);

    let scriptId = null;
    let versions = [];
    let sessions = [];
    let saveTimer = null;

    // ---------- 草稿条目编辑 ----------
    function readEntriesFromDom() {
      return [...$('#entries').querySelectorAll('.entry-row')].map((row) => ({
        seq: Number(row.querySelector('.seq').value),
        text: row.querySelector('.text').value,
      }));
    }

    function renderEntries(list, focusLast = false) {
      const box = $('#entries');
      box.innerHTML = '';
      list.forEach((item, idx) => {
        const seqInput = h('input', { class: 'seq', type: 'number', min: '1', step: '1', value: String(item.seq ?? idx + 1) });
        const textInput = h('input', { class: 'text', type: 'text', placeholder: `第 ${item.seq ?? idx + 1} 条字幕…`, value: item.text ?? '' });
        const del = h('button', {
          class: 'small danger',
          onclick: () => {
            renderEntries(readEntriesFromDom().filter((_, i) => i !== idx));
            scheduleSave();
          },
        }, '删除');
        for (const inp of [seqInput, textInput]) {
          inp.addEventListener('input', scheduleSave);
        }
        box.append(h('div', { class: 'entry-row' }, [seqInput, textInput, del]));
      });
      if (focusLast) {
        const rows = box.querySelectorAll('.entry-row input.text');
        if (rows.length) rows[rows.length - 1].focus();
      }
    }

    function scheduleSave() {
      clearTimeout(saveTimer);
      $('#draft-status').textContent = '待保存…';
      saveTimer = setTimeout(saveDraft, 500);
    }

    async function saveDraft() {
      if (!scriptId) return;
      const entries = readEntriesFromDom();
      try {
        const r = await socket.call('saveDraft', { scriptId, entries });
        $('#draft-status').textContent = `草稿已保存 · ${r.count} 条 · ${new Date().toLocaleTimeString()}`;
      } catch (err) {
        $('#draft-status').textContent = '保存失败';
        toast(err.message, 'error');
      }
    }

    $('#add-entry').addEventListener('click', () => {
      const list = readEntriesFromDom();
      const nextSeq = list.reduce((m, e) => Math.max(m, Number(e.seq) || 0), 0) + 1;
      list.push({ seq: nextSeq, text: '' });
      renderEntries(list, true);
      scheduleSave();
    });

    $('#renumber').addEventListener('click', () => {
      const list = readEntriesFromDom();
      list.sort((a, b) => (Number(a.seq) || 0) - (Number(b.seq) || 0));
      list.forEach((e, i) => { e.seq = i + 1; });
      renderEntries(list);
      scheduleSave();
      toast('已按顺序整理为连续序号', 'ok', 1800);
    });

    $('#load-demo').addEventListener('click', () => {
      renderEntries([
        { seq: 1, text: '第一幕 · 胡同口，黄昏' },
        { seq: 2, text: '（雨声渐起）你来了。' },
        { seq: 3, text: '我等了很久——久到以为你不会来。' },
        { seq: 4, text: '谢幕：感谢今晚每一位观众。' },
      ]);
      scheduleSave();
    });

    // ---------- 发布 ----------
    $('#publish').addEventListener('click', async () => {
      const entries = readEntriesFromDom();
      const label = $('#publish-label').value.trim();
      try {
        const r = await socket.call('publishVersion', { scriptId, label, entries });
        $('#publish-label').value = '';
        toast(`已发布 v${r.version.version}（${r.version.total} 条），内容已固化`, 'ok', 4000);
      } catch (err) {
        toast(`发布被拒绝：${err.message}`, 'error', 5000);
      }
    });

    // ---------- 版本 / 场次渲染 ----------
    function renderVersions() {
      const box = $('#version-list');
      const sel = $('#session-version');
      box.innerHTML = '';
      sel.innerHTML = '';
      if (!versions.length) {
        box.append(h('span', { class: 'muted' }, '尚无版本'));
        sel.append(h('option', { value: '' }, '请先发布版本'));
        return;
      }
      versions.forEach((v) => {
        const count = (() => { try { return JSON.parse(v.entriesJson).length; } catch { return 0; } })();
        box.append(h('div', { class: 'pill' }, [
          h('span', { class: 'seq' }, `v${v.version}`),
          h('span', { class: 'text' }, v.label || '（无备注）'),
          h('span', { class: 'muted' }, `${count} 条 · ${new Date(v.createdAt).toLocaleString()}`),
        ]));
        sel.append(h('option', { value: String(v.id) }, `v${v.version} ${v.label ? '· ' + v.label : ''}（${count}条）`));
      });
    }

    const statusBadge = (s) => {
      const map = { ready: ['待开演', 'ready'], live: ['演出中', 'live'], closed: ['已结束', 'closed'] };
      const [t, cls] = map[s.status] || [s.status, ''];
      return h('span', { class: `badge ${cls}` }, t);
    };

    function renderSessions() {
      const box = $('#session-list');
      box.innerHTML = '';
      if (!sessions.length) {
        box.append(h('span', { class: 'muted' }, '尚无场次'));
        return;
      }
      sessions.forEach((s) => {
        const v = versions.find((x) => x.id === s.versionId);
        box.append(h('div', { class: 'pill' }, [
          statusBadge(s),
          h('span', { class: 'text' }, s.name),
          h('span', { class: 'muted' }, v ? `v${v.version}` : '未绑定版本'),
          h('a', { class: 'small', href: `/operator.html?session=${s.id}` }, '操作员台 →'),
          h('a', { class: 'small', href: `/audience.html?session=${s.id}`, target: '_blank' }, '观众屏 ↗'),
        ]));
      });
    }

    $('#create-session').addEventListener('click', async () => {
      const name = $('#session-name').value.trim();
      const versionId = Number($('#session-version').value);
      if (!name) return toast('请填写场次名称', 'warn');
      if (!versionId) return toast('请先发布并选择一个版本', 'warn');
      try {
        const r = await socket.call('createSession', { scriptId, name, versionId });
        $('#session-name').value = '';
        toast(`场次已创建（#${r.sessionId}），可在操作员台开始演出`, 'ok');
      } catch (err) {
        toast(err.message, 'error');
      }
    });

    // ---------- 数据加载与订阅 ----------
    function applyData(data) {
      versions = data.versions || [];
      sessions = data.sessions || [];
      renderVersions();
      renderSessions();
      const entriesBox = $('#entries');
      if (!entriesBox.children.length) {
        let draft = [];
        try { draft = JSON.parse(data.draft.entriesJson); } catch { draft = []; }
        renderEntries(Array.isArray(draft) && draft.length ? draft : []);
      }
    }

    async function loadScripts(selectId) {
      const res = await fetch('/api/scripts');
      const data = await res.json();
      const sel = $('#script-select');
      sel.innerHTML = '';
      data.scripts.forEach((s) => sel.append(h('option', { value: String(s.id) }, s.title)));
      if (selectId) sel.value = String(selectId);
      return Number(sel.value);
    }

    $('#script-select').addEventListener('change', async () => {
      scriptId = Number($('#script-select').value);
      history.replaceState(null, '', `?script=${scriptId}`);
      const res = await fetch(`/api/scripts/${scriptId}`);
      applyData(await res.json());
    });

    $('#new-script').addEventListener('click', async () => {
      const title = window.prompt('新剧本标题：', '未命名剧本');
      if (!title || !title.trim()) return;
      try {
        const r = await socket.call('createScript', { title: title.trim() });
        scriptId = r.scriptId;
        await loadScripts(scriptId);
        const res = await fetch(`/api/scripts/${scriptId}`);
        applyData(await res.json());
      } catch (err) {
        toast(err.message, 'error');
      }
    });

    socket.events.addEventListener('subscribed', (e) => {
      const msg = e.detail;
      if (msg.draft) applyData(msg);
    });
    socket.events.addEventListener('script_changed', (e) => {
      const msg = e.detail;
      if (msg.scriptId === scriptId) {
        versions = msg.versions;
        sessions = msg.sessions;
        renderVersions();
        renderSessions();
      }
    });

    (async function init() {
      const params = new URLSearchParams(location.search);
      const wanted = Number(params.get('script'));
      scriptId = await loadScripts(wanted);
      socket.subscribe('script', { scriptId });
      const res = await fetch(`/api/scripts/${scriptId}`);
      applyData(await res.json());
    })();
  })();
  </script>
</body>
</html>
